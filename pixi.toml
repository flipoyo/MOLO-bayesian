# Environment of bayesian_inversion on its own; it does not need pyheatmy. Within the MOLONARI-computo tree, the
# pixi.toml at the root of the tree installs bayesian_inversion together with the other packages.
[workspace]
name = "bayesian_inversion"
version = "0.4.3"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.10,<3.14"
numpy = "*"
tqdm = "*"
pytest = "*"
setuptools = "*"

[pypi-dependencies]
bayesian_inversion = { path = ".", editable = true }

[tasks]
# SemVer of this repository: pixi.toml is the reference, see scripts/bump_version.py
bump-version = "python scripts/bump_version.py"
check-version = "python scripts/bump_version.py --check"
# the tests marked slow run an MCMC
test = "pytest tests"

# the oldest and the newest Python of the environment, tested on GitHub Actions
[feature.py310.dependencies]
python = "3.10.*"

[feature.py313.dependencies]
python = "3.13.*"

[environments]
py310 = ["py310"]
py313 = ["py313"]
